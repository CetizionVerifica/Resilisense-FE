name: Deploy to EC2

on:
  push:
    branches:
      - legacy

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |

             cd /home/ubuntu/Resilisense-FE/ || exit 1
             git config pull.rebase false
             git add . && git commit -m "Committing uncommitted changes" || echo "No changes to commit"
             git pull origin legacy
             npm install --force
             export NVM_DIR="$HOME/.nvm"
             [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
             nvm use node
             pm2 restart Resilisense-FE
             echo "======END======"

