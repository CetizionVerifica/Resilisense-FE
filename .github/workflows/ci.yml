name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci # also generates src/api from the committed api/openapi.json
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npm test
      - run: npm run build
      - name: Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: E2E journeys + axe (API mocked with MSW)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - name: Storybook builds
        run: npm run build-storybook -- --quiet
      - name: Dependency audit (production, high+)
        run: npm run audit

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Build the web image (not pushed; deploy workflow comes with Kamal, playbook step 6)
        run: docker build -t resilisense-web:ci .

  secrets:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
      - name: gitleaks (working tree)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks dir . --no-banner --redact
